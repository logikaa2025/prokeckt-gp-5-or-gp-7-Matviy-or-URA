<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API for Phones</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }

        .controls {
            margin-bottom: 20px;
        }

        input {
            padding: 8px 12px;
            width: 300px;
            font-size: 14px;
        }

        button {
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Стилі для списку телефонів */
        .phone-list {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .phone-card {
            border: 2px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            background-color: white;
            width: 180px;
            transition: all 0.3s ease;
        }

        /* Клас, який додається для виділеного телефону */
        .phone-card.highlight {
            border-color: #28a745;
            background-color: #d4edda;
            box-shadow: 0 0 10px rgba(40, 167, 69, 0.5);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <script></script>

    <h1>Привіт!</h1>
    <p>Це моя перша HTML-сторінка.</p>
    
    <h1>API for Phones</h1>

    <div class="controls">
        <button>Get Your Free API Key</button>
        <button>View API Documentation</button>
    </div>

    <div class="controls">
        <!-- Поле пошуку -->
        <input type="text" id="searchInput" placeholder="Напиши назву телефона лінійки S (напр. S24)">
        <!-- Кнопка пошуку -->
        <button id="searchBtn">Search →</button>
    </div>
    </script>

</body>
</html>
